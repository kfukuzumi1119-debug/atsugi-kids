<body>
<div class="wrap">
  <nav class="site-nav" aria-label="サイト">
    <a class="brand" href="./">あつぎ子連れイベント帳</a>
    <ul>
      <li><a href="about.html">このサイトについて</a></li>
    </ul>

  <header class="top">
    <p class="eyebrow">神奈川県央｜厚木・海老名・座間・綾瀬・大和・相模原・伊勢原・愛川</p>
    <h1>子連れで行ける週末イベント</h1>
    <p class="intro">厚木市を中心に、神奈川県央で開かれる子ども・親子向けのイベントを毎週金曜日にまとめています。お祭り、工作体験、公園の自然観察、図書館のおはなし会まで、子連れのおでかけ先探しにどうぞ。</p>
    <p class="meta" id="meta">イベントを読み込んでいます…</p>
  </header>

  <div class="filters" id="filters" role="search">
    <div class="bar">
      <div class="seg" role="group" aria-label="期間">
        <button type="button" id="r-weekend" data-range="weekend" aria-pressed="false">今週末</button>
        <button type="button" id="r-2w" data-range="2w" aria-pressed="false">2週間</button>
        <button type="button" id="r-month" data-range="month" aria-pressed="true">1か月</button>
        <button type="button" id="r-all" data-range="all" aria-pressed="false">すべて</button>
      </div>
      <button type="button" class="toggle" id="toggle" aria-expanded="false" aria-controls="panel">
        絞り込み<span class="fcount" id="fcount" hidden></span>
      </button>
    </div>
    <div class="panel" id="panel" hidden>
      <div class="row" id="cityRow"><span class="row-label">エリア</span></div>
      <div class="row" id="ageRow">
        <span class="row-label">年齢</span>
        <button type="button" class="chip" id="a-baby" data-age="baby" aria-pressed="false">0〜2歳</button>
        <button type="button" class="chip" id="a-kinder" data-age="kinder" aria-pressed="false">3〜6歳</button>
        <button type="button" class="chip" id="a-school" data-age="school" aria-pressed="false">小学生</button>
      </div>
      <div class="row">
        <span class="row-label">条件</span>
        <button type="button" class="chip" id="f-free" aria-pressed="false">無料のみ</button>
        <button type="button" class="chip" id="f-walkin" aria-pressed="false">予約なしで行ける</button>
        <button type="button" class="chip" id="f-fav" aria-pressed="false">★ 行きたい</button>
      </div>
      <div class="row">
        <input class="search" id="q" type="search" placeholder="キーワード（例：ハロウィン、公園、工作）" aria-label="キーワードで探す">
      </div>
      <div class="panel-foot">
        <button type="button" class="linkbtn" id="clear">条件をクリア</button>
        <button type="button" class="done" id="done">この条件で見る</button>
      </div>
    </div>
  </div>

  <main id="list" aria-live="polite">
    <noscript><div class="notice">イベント一覧を表示するには JavaScript を有効にしてください。</div></noscript>
  </main>
